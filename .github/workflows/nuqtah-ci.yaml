name: nuqtah ci build & push & deploy
run-name: nuqtah ci build & push & deploy for ${{ github.ref_name }}

on:
  push:
    tags:
      - "v*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag for the Docker image (e.g., v1.0 or git SHA)"
        required: true
        type: string

# avoid concurrent runs of this workflow, e.g. when multiple commits are pushed in quick succession
concurrency:
  group: nuqtah-ci
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint

  docker-build-push:
    needs: lint
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract version from reference
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.tag }}"
          else
            VERSION="${{ github.ref_name }}"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/nuqtah:${{ steps.version.outputs.VERSION
            }},${{ vars.DOCKERHUB_USERNAME }}/nuqtah:latest
          # registry caching to speed up subsequent builds
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    # write permission needed to push the updated values.yaml back to the repo
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: docker-build-push
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Set image tag in values.yaml
        env:
          VERSION: ${{ needs.docker-build-push.outputs.version }}
        run: |
          echo "Updating image tag to $VERSION"
          yq e ".deployment.image.tag = \"$VERSION\"" -i "devops/helm/apps/nuqtah/values.yaml"
      - name: Commit and push updated values.yaml
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add devops/helm/apps/nuqtah/values.yaml
          git commit -m "cd: update nuqtah image tag to ${{ needs.docker-build-push.outputs.version }}"
          git pull --rebase origin main
          git push origin main
